name: Build MotoHub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Получаем проект
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. Java 17
      # =========================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================
      # 3. Android Command Line Tools
      # =========================
      - name: Install Android Command Line Tools
        shell: bash
        run: |
          set -e

          ANDROID_SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_VERSION="12266719"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" \
            -o /tmp/cmdline-tools.zip

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          unzip -q /tmp/cmdline-tools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK installed:"
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"

      # =========================
      # 4. Проверяем sdkmanager
      # =========================
      - name: Check sdkmanager
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager
          sdkmanager --version

      # =========================
      # 5. Принимаем лицензии Android
      # =========================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # =========================
      # 6. Устанавливаем Android SDK
      # =========================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================
      # 7. Проверяем структуру проекта
      # =========================
      - name: Check project files
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      # =========================
      # 8. Устанавливаем Gradle
      # =========================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # =========================
      # 9. Проверяем Gradle
      # =========================
      - name: Check Gradle
        run: |
          gradle --version

      # =========================
      # 10. Собираем APK
      # =========================
      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      # =========================
      # 11. Ищем APK
      # =========================
      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      # =========================
      # 12. Подготавливаем APK
      # =========================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            release/MotoHub-debug.apk

          echo "Prepared APK:"
          ls -lh release/MotoHub-debug.apk

      # =========================
      # 13. Загружаем APK в GitHub
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoHub-APK
          path: release/MotoHub-debug.apk
          if-no-files-found: error
          retention-days: 30
